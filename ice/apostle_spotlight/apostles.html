<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        #content{
            margin: auto;
            border-radius: 10px;
            width: 800px;
            background-image: url(images/christus.webp);
            border: 10px solid black;
            padding: 50px 150px;
        }
        h1,
        h2{
            text-align: center;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }
        
        #pics{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
        }
        #pics{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
        }
        #fp{
            display: grid;
            grid-template-columns:  1fr 1fr 1fr;
            padding: 10px 100px;
        }
        img{
            height: 150px;
            border-radius: 100%;
            border: 15px solid white;
        }
        #oaks{
            height: 200px;
        }
    </style>
</head>
<body>
    <div id="content">
        <h1>First Presidency</h1>
        <div id="fp">
            <img src="images/eyring.webp">
            <img id="oaks" src="images/oaks.webp">
            <img src="images/christofferson.webp">
        </div>
        <h2>Quorum of the Twelve Apostles</h2>
        <div id="pics">
            <img src="images/holland.webp">
            <img src="images/uchtdorf.webp">
            <img src="images/bednar.webp">
            <img src="images/cook.webp">
            <img src="images/anderson.webp">
            <img src="images/rasband.webp">
            <img src="images/christofferson.webp">
            <img src="images/renlund.webp">
            <img src="images/gong.webp">
            <img src="images/soares.webp">
            <img src="images/kearon.webp">
            <img src="images/causse.webp">
        </div>



    </div>
</body>
</html>
