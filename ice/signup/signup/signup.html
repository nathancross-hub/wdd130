<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
        }
        #formContainer{
            height: auto;
            width: 400px;
            background-color: white;
            border-radius: 10px;
            border: solid blue 10px;
            margin: auto;
        }
        #top{
            width: 400px;
            height: 180px;
            background-image: url(images/jesus_feeds_5000.jpeg);
            background-size: cover;
            text-align: center;
            color: white;
            text-shadow: 4px 4px 4px black;            
        }

        #closeBtn{
            position: relative;
            top: -210px;
            left: 15px;
        }
        #bottom{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            grid-gap: 5px;
            
        }
        img{
            width: 76px;
            height: auto;
        }
        #enter{
            width: 370px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-gap: 20px;
            margin: auto;
        }
        h3{
            text-align: center;
            padding: 10px;
        }
        #btns{
            margin: auto;
            padding: 20px;
            align-items: center;
            display: grid;
            grid-template-columns: 1fr;
            grid-gap: 20px;
            text-align: center;
        }
        h1, h2{
            position: relative;
            top: 75px;
        }
    </style>




</head>

<body>
    <div id="formContainer">
        <header>
            <div id="top">
                <h1>Daily Feed</h1>
                <h2>Scripture a Day</h2>
            </div>
        </header>
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <button type="button" id="closeBtn">X</button>
            <div id="enter">
                <label for="username">User Name:</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label>Gender:</label>
                
                <div>
                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="female" required>
                    <label for="female">Female</label>
                </div>
            </div>

            <div id="btns">
                <section>
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Subscribe to newsletter</label>
                </section>

                <section>
                    <input type="checkbox" id="conditions" name="conditions" required>
                    <label for="conditions">I acknowledge the terms and conditions</label>
                </section>

                <section>
                    <button type="submit">Submit</button>
                </section>
            </div>

        </form>
        <footer id="bottom">
            <img src="images/old_testament.webp">
            <img src="images/new_testament.webp">
            <img src="images/book_of_mormon.webp">
            <img src="images/doctrine_and_covenants.webp">
            <img src="images/pearl_of_great_price.webp">
        </footer>
    </div>

    

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
